services:
  postgres:
    image: postgres:16-alpine
    container_name: pkbm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pkbm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pkbm_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pkbm_mugi_sae}
    ports:
      - "5432:5432"
    volumes:
      - pkbm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pkbm_user} -d ${POSTGRES_DB:-pkbm_mugi_sae}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pkbm-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pkbm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pkbm_user}:${POSTGRES_PASSWORD:-pkbm_pass}@postgres:5432/${POSTGRES_DB:-pkbm_mugi_sae}
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      UPLOAD_PATH: ${UPLOAD_PATH:-./uploads}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - pkbm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pkbm-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pkbm-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pkbm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pkbmmugiasae.sch.id}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pkbm_pgadmin_data:/var/lib/pgadmin
    networks:
      - pkbm-net
    profiles:
      - tools

volumes:
  pkbm_postgres_data:
  pkbm_pgadmin_data:

networks:
  pkbm-net:
    driver: bridge
